<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - XAM Goth Apparel</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="XAM-Website/assets/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="XAM-Website/assets/images/favicon.svg" />
    <link rel="shortcut icon" href="XAM-Website/assets/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="XAM-Website/assets/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="XAM Store" />
    <link rel="manifest" href="XAM-Website/assets/images/site.webmanifest" />
    <!-- =================== -->
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ============================================ -->
    <!-- DIV BLANCO que envuelve el ENCABEZADO        -->
    <!-- ============================================ -->

    <div class="header-wrapper" style="background-color: #ffffff; width: 100%; border-bottom: 2px solid #cccccc;">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <!-- Logo y nombre -->
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo.png" alt="XAM Goth Apparel" height="40" class="d-inline-block align-middle">
                    <span class="ms-2 brand-text">XAM Goth Apparel</span>
                </a>

                <!-- Botón menú hamburguesa (para móvil) -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" data-i18n="nav-home">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="products.html" data-i18n="nav-products">Productos</a>
                        </li>
                        <!-- Selector de idioma -->
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-globe2"></i> <span id="current-lang">ES</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><button class="dropdown-item" data-lang="es">🇪🇸 Español</button></li>
                                <li><button class="dropdown-item" data-lang="en">🇬🇧 English</button></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- ===== FIN DEL DIV BLANCO DEL ENCABEZADO ===== -->

    <!-- ================= CATÁLOGO ================= -->
    <section class="py-5">
        <div class="container">
            <h1 class="section-title text-center mb-5" data-i18n="catalog-title">Nuestros Productos</h1>
            
<div class="container mb-5">
    
    <div class="row g-3">
        <!-- Columna 1: Acordeón de categorías -->
        <div class="col-md-6">
            <div class="accordion" id="categoryAccordion">
                <div class="accordion-item" style="background: #1a1a1a; border: 1px solid #333;">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#categoryCollapse" style="background: #1a1a1a; color: #ffffff; border: none;">
                            <i class="bi bi-tags me-2"></i> <span data-i18n="filter-by-category">Filtrar por categoría</span>
                        </button>
                    </h2>
                    <div id="categoryCollapse" class="accordion-collapse collapse" data-bs-parent="#categoryAccordion">
                        <div class="accordion-body" style="background: #0a0a0a;">
                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn btn-outline-light filter-category active" data-category="all" data-i18n="filter-all">Todos</button>
                                <button class="btn btn-outline-light filter-category" data-category="accesorios" data-i18n="filter-accessories">Accesorios</button>
                                <button class="btn btn-outline-light filter-category" data-category="camisas" data-i18n="filter-shirts">Camisas</button>
                                <button class="btn btn-outline-light filter-category" data-category="faldas" data-i18n="filter-skirts">Faldas</button>
                                <button class="btn btn-outline-light filter-category" data-category="maletas" data-i18n="filter-bags">Maletas</button>
                                <button class="btn btn-outline-light filter-category" data-category="pantalones" data-i18n="filter-pants">Pantalones</button>
                                <button class="btn btn-outline-light filter-category" data-category="peluches" data-i18n="filter-plushies">Peluches</button>
                                <button class="btn btn-outline-light filter-category" data-category="zapatos" data-i18n="filter-shoes">Zapatos</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <div class="col-md-6">
        <div class="accordion" id="priceAccordion">
            <div class="accordion-item" style="background: #1a1a1a; border: 1px solid #333;">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#priceCollapse" style="background: #1a1a1a; color: #ffffff; border: none;">
                        <i class="bi bi-currency-dollar me-2"></i> <span data-i18n="filter-by-price">Filtrar por precio</span>
                    </button>
                </h2>
                <div id="priceCollapse" class="accordion-collapse collapse" data-bs-parent="#priceAccordion">
                    <div class="accordion-body" style="background: #0a0a0a;">
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-light filter-price active" data-price="all" data-i18n="price-all">Todos</button>
                            <button class="btn btn-outline-light filter-price" data-price="menos-20" data-i18n="price-less-20">Menos de $20.000</button>
                            <button class="btn btn-outline-light filter-price" data-price="20-50" data-i18n="price-20-50">$20.000 - $50.000</button>
                            <button class="btn btn-outline-light filter-price" data-price="50-100" data-i18n="price-50-100">$50.000 - $100.000</button>
                            <button class="btn btn-outline-light filter-price" data-price="mas-100" data-i18n="price-more-100">Más de $100.000</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

            <!-- Grid de productos -->
            <div class="row g-4" id="product-grid">
                <!-- Los productos se generarán dinámicamente con JavaScript -->
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- DIV BLANCO que envuelve el PIE DE PÁGINA     -->
    <!-- ============================================ -->
    <div class="footer-wrapper" style="background-color: #ffffff; width: 100%; border-top: 2px solid #cccccc; margin-top: auto;">
        <footer class="py-4">
            <div class="container text-center">
                <p class="mb-2" style="color: #000000 !important;">
                    &copy; 2026 XAM GOTH APPAREL. <span data-i18n="footer-rights">Todos los derechos reservados.</span>
                </p>
                <div class="social-icons">
                    <a href="https://www.tiktok.com/@xam.goth.apparel" target="_blank" class="me-3 fs-3" style="color: #000000 !important;">
                        <i class="bi bi-tiktok"></i>
                    </a>
                    <a href="https://www.instagram.com/xam_gothapparel/" target="_blank" class="fs-3" style="color: #000000 !important;">
                        <i class="bi bi-instagram"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>
    <!-- ===== FIN DEL DIV BLANCO DEL PIE DE PÁGINA ===== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
