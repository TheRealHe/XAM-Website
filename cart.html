<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - XAM Goth Apparel</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- ENCABEZADO                                   -->
    <!-- ============================================ -->
    <div class="header-wrapper" style="background-color: #ffffff; width: 100%; border-bottom: 2px solid #cccccc;">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo.png" alt="XAM Goth Apparel" height="40" class="d-inline-block align-middle">
                    <span class="ms-2 brand-text">XAM Goth Apparel</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" data-i18n="nav-home">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="products.html" data-i18n="nav-products">Productos</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-globe2"></i> <span id="current-lang">ES</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><button class="dropdown-item" data-lang="es">🇪🇸 Español</button></li>
                                <li><button class="dropdown-item" data-lang="en">🇬🇧 English</button></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

   <!-- ============================================ -->
    <!-- CONTENIDO DEL CARRITO                        -->
    <!-- ============================================ -->
    <section class="py-5 bg-dark text-white" style="min-height: 70vh;">
        <div class="container">
            <!-- Título y botones en la misma fila -->
            <div class="row align-items-center mb-4">
                <div class="col-md-6">
                    <h1 class="section-title text-start mb-0" data-i18n="cart-title">🛒 Carrito</h1>
                </div>
                <div class="col-md-6 text-end">
                    <a href="products.html" class="btn btn-outline-light me-2" data-i18n="cart-continue">Seguir comprando</a>
                    <button onclick="clearCart()" class="btn btn-outline-light" data-i18n="cart-clear">Vaciar carrito</button>
                </div>
            </div>
            
            <!-- Mensaje cuando el carrito está vacío -->
            <div id="cart-empty" class="text-center py-5">
                <i class="bi bi-cart3" style="font-size: 4rem; color: #444;"></i>
                <p class="mt-3" style="color: #888;" data-i18n="cart-empty">Tu carrito está vacío.</p>
                <a href="products.html" class="btn btn-outline-light mt-3" data-i18n="cart-continue">Seguir comprando</a>
            </div>
            
            <!-- Contenedor de items del carrito -->
            <div id="cart-items-container" style="display: none;">
                <div id="cart-items"></div>
                
                <!-- Total y botón de WhatsApp -->
                <div class="cart-actions mt-4">
                    <div class="row align-items-center">
                        <div class="col-md-6 text-start">
                            <button onclick="sendOrder()" class="btn btn-checkout">
                                <i class="bi bi-whatsapp me-2"></i> <span data-i18n="cart-checkout">Comprar por WhatsApp</span>
                            </button>
                        </div>
                        <div class="col-md-6 text-end">
                            <div id="cart-total"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- PIE DE PÁGINA                               -->
    <!-- ============================================ -->
    <div class="footer-wrapper" style="background-color: #ffffff; width: 100%; border-top: 2px solid #cccccc; margin-top: auto;">
        <footer class="py-4">
            <div class="container text-center">
                <p class="mb-2" style="color: #000000 !important;">
                    &copy; 2026 XAM GOTH APPAREL | <span data-i18n="footer-rights">Todos los derechos reservados.</span>
                </p>
                <div class="social-icons d-flex justify-content-center gap-4">
                    <a href="https://www.tiktok.com/@xam.goth.apparel" target="_blank" class="fs-3" style="color: #000000 !important;">
                        <i class="bi bi-tiktok"></i>
                    </a>
                    <a href="https://www.instagram.com/xam_gothapparel/" target="_blank" class="fs-3" style="color: #000000 !important;">
                        <i class="bi bi-instagram"></i>
                    </a>
                    <a href="https://wa.me/573123271353" target="_blank" class="fs-3" style="color: #000000 !important;">
                        <i class="bi bi-whatsapp"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <!-- ============================================ -->
    <!-- LIGHTBOX                                   -->
    <!-- ============================================ -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">✕</button>
        <div class="lightbox-content">
            <button class="lightbox-prev" id="lightbox-prev">‹</button>
            <img id="lightbox-img" src="" alt="">
            <button class="lightbox-next" id="lightbox-next">›</button>
        </div>
        <div class="lightbox-counter" id="lightbox-counter">1 / 3</div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                     -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>

</body>
</html>
