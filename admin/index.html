<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirigiendo al panel de administración...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #2a2a2a;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 8px;
        }
        p {
            color: #888888;
            font-size: 0.95rem;
        }
        a {
            color: #ffffff;
            text-decoration: underline;
            transition: color 0.3s;
        }
        a:hover {
            color: #aaaaaa;
        }
    </style>
    <!-- Redirección automática después de 1.5 segundos -->
    <meta http-equiv="refresh" content="1.5; url=https://app.pagescms.org/TheRealHe/XAM-Website" />
</head>
<body>
    <div class="loader"></div>
    <h1>🖤 XAM Goth Apparel</h1>
    <p>Redirigiendo al panel de administración...</p>
    <p style="margin-top: 12px; font-size: 0.85rem;">
        Si no eres redirigido automáticamente, 
        <a href="https://app.pagescms.org/TheRealHe/XAM-Website">haz clic aquí</a>.
    </p>
</body>
</html>
