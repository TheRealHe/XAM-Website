backend:
  name: git-gateway
  branch: master

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "productos"
    label: "Productos"
    folder: "data/"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    summary: "{{nombre.es}} - ${{precio}}"

    fields:
      - { label: "ID", name: "id", widget: "number", required: false }
      
      - label: "Nombre"
        name: "nombre"
        widget: "object"
        fields:
          - { label: "Español", name: "es", widget: "string" }
          - { label: "Inglés", name: "en", widget: "string" }
      
      - label: "Descripción"
        name: "descripcion"
        widget: "object"
        fields:
          - { label: "Español", name: "es", widget: "text" }
          - { label: "Inglés", name: "en", widget: "text" }
      
      - { label: "Precio", name: "precio", widget: "number" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Camisas", value: "camisas" }
          - { label: "Accesorios", value: "accesorios" }
          - { label: "Pantalones", value: "pantalones" }
          - { label: "Zapatos", value: "zapatos" }
          - { label: "Faldas", value: "faldas" }
          - { label: "Peluches", value: "peluches" }
          - { label: "Maletas", value: "maletas" }
          
      - label: "Imágenes"
        name: "imagenes"
        widget: "cloudinary"
      
      - { label: "Activo", name: "activo", widget: "boolean", default: true }