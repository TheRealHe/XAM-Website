backend:
  name: git-gateway
  branch: master

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "productos"
    label: "Productos"
    folder: "data/"
    extension: "json"
    format: "json"
    create: true
    slug: "productos"
    summary: "{{nombre_es}} - ${{precio}}"

    fields:
      - { label: "ID", name: "id", widget: "number", required: false }
      - { label: "Nombre (ES)", name: "nombre_es", widget: "string" }
      - { label: "Nombre (EN)", name: "nombre_en", widget: "string" }
      - { label: "Descripción (ES)", name: "descripcion_es", widget: "text" }
      - { label: "Descripción (EN)", name: "descripcion_en", widget: "text" }
      - { label: "Precio", name: "precio", widget: "number" }
      - { label: "Categoría", name: "categoria", widget: "string" }

      - label: "Imágenes"
        name: "imagenes"
        widget: "list"
        field:
          widget: "image"

      - { label: "Activo", name: "activo", widget: "boolean", default: true }